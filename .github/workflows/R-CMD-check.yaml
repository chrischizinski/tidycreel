# Source: https://github.com/r-lib/actions/blob/v2/examples/README.md
# Modified per CONTEXT.md: latest R release only, full cross-platform
name: R-CMD-check

on:
  push:
    branches: [main, v2-foundation]
  pull_request:

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    # The check name is matrix.config.label, not the runner. Branch protection
    # requires "ubuntu-latest (R release)" by name, so the Linux job keeps that
    # label while running pinned ubuntu-24.04 (GitHub moves ubuntu-latest to
    # 26.04 between 2026-10-19 and 2026-11-19). Rename it only together with the
    # required-check setting.
    name: ${{ matrix.config.label }} (R release)
    timeout-minutes: 75

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-24.04, label: ubuntu-latest, r: 'release'}
          - {os: macos-latest, label: macos-latest, r: 'release'}
          - {os: windows-latest, label: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Run the full test suite. Without this, tests/testthat.R runs only the
      # CRAN core subset, because rcmdcheck does not set NOT_CRAN.
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/harden-apt
        if: runner.os == 'Linux'

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 20
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
