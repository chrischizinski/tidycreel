name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        id: get_diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff

      # No continue-on-error: a failed API call must redden this job. Green
      # previously meant only "the job ran", because the failure left review.md
      # absent and the post step was skipped silently. This check is advisory and
      # is deliberately NOT in branch protection, so a red X here costs nothing
      # but tells the truth.
      - name: Run Gemini Code Review
        id: run_review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/gemini-review.py

      # review.md is absent only when the diff was empty; any real failure has
      # already stopped the job above.
      - name: Post Review to PR
        if: hashFiles('review.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} --comment -F review.md
