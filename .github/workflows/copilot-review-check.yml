name: Copilot Review Check

# Asserts that a Copilot code review exists for the CURRENT head commit.
#
# Copilot does not re-review on a new push: a review records the commit_id it ran
# against, so pushing after a review leaves the new commits unreviewed while the PR
# still shows a review. This job makes that state visible instead of implicit.
#
# It checks only that the review happened, never what it said. Findings stay advisory
# -- a reviewer that blocks merges on false positives gets dismissed on reflex.
#
# The job REQUESTS the review and then WAITS for it, rather than failing on the push
# and relying on a later event to re-run itself. Two things made the event-driven
# design need a manual `gh run rerun` after every single push:
#
#   1. the `pull_request` run fires the instant the commit lands, when no review can
#      possibly exist yet, so it failed by construction and stayed red until someone
#      re-ran it by hand;
#   2. the `pull_request_review` run that was supposed to clear that red never
#      executed -- a run triggered by a bot's review lands in `action_required` and
#      waits for approval, and on a PR that edits this workflow it runs from the base
#      branch, where the change does not exist yet.
#
# Waiting in-job removes the dependency on both. `pull_request_review` is kept only
# as an accelerator: when it does run, it confirms in seconds.
#
# A failed API call is reported as a failed API call, never as a missing review:
# swallowing the error would produce an empty list and an authoritative-sounding
# "no review for this commit" that names the wrong cause.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  # write, because the job requests the review it then waits for.
  pull-requests: write

jobs:
  copilot-review:
    # Drafts are work in progress; requiring a review per push there is noise.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Assert a Copilot review covers the head commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Copilot has taken 1-4 minutes to submit in practice. Twelve minutes is
          # slack for a slow queue without letting a silent failure hold the PR all
          # day; the job's own timeout-minutes is the backstop.
          WAIT_SECONDS: 720
          POLL_SECONDS: 20
        run: |
          set -euo pipefail

          echo "PR #${PR} head commit: ${HEAD_SHA}"

          # One commit_id per line, across pages.
          #
          # type == "Bot" because a human account named copilot-something would
          # otherwise satisfy the check. state != "DISMISSED" because a dismissed
          # review still carries its commit_id, and a dismissed review is exactly
          # the case where the coverage no longer stands. Login is matched by
          # prefix rather than exact name so a bot rename fails this check loudly
          # instead of matching nothing and passing.
          # Fetched into a file, and NEVER through a pipeline: a function that
          # ends in `| grep` runs in a subshell, where `exit 1` on an API failure
          # exits only that subshell and the caller reads it as "no review yet" --
          # which is the exact failure mode this check was written to refuse.
          fetch_reviews() {
            if ! gh api "repos/${REPO}/pulls/${PR}/reviews" --paginate \
              --jq '.[]
                    | select(.user.type == "Bot")
                    | select(.user.login | ascii_downcase | startswith("copilot"))
                    | select(.state != "DISMISSED")
                    | .commit_id' \
              > reviewed_shas.txt
            then
              echo "::error title=Could not fetch reviews::gh api failed for repos/${REPO}/pulls/${PR}/reviews. This is an API, permission or rate-limit failure, NOT a missing review."
              exit 1
            fi
          }

          fetch_reviews
          if grep -Fxq "${HEAD_SHA}" reviewed_shas.txt; then
            echo "PASS: a Copilot review already covers ${HEAD_SHA}."
            exit 0
          fi

          # Ask for one. A 422 here means a review is already requested or in
          # flight, which is not an error -- the wait below is what decides.
          echo "No review yet for ${HEAD_SHA}; requesting one."
          gh api --method POST \
            "repos/${REPO}/pulls/${PR}/requested_reviewers" \
            -f "reviewers[]=copilot-pull-request-reviewer[bot]" \
            --silent \
            || echo "Request returned non-zero (already requested, or in flight). Waiting anyway."

          deadline=$(( SECONDS + WAIT_SECONDS ))
          while [ "${SECONDS}" -lt "${deadline}" ]; do
            sleep "${POLL_SECONDS}"
            fetch_reviews
            if grep -Fxq "${HEAD_SHA}" reviewed_shas.txt; then
              echo "PASS: a Copilot review covers ${HEAD_SHA}."
              exit 0
            fi
            echo "  still waiting ($(( deadline - SECONDS ))s left)..."
          done

          echo
          echo "::error title=No Copilot review for this commit::Waited ${WAIT_SECONDS}s and the most recent push is still not covered by a Copilot code review."
          echo "Copilot has an active review on these commits:"
          if [ -s reviewed_shas.txt ]; then sed 's/^/  /' reviewed_shas.txt; else echo "  (none)"; fi
          cat <<EOF

          No Copilot review found for head commit ${HEAD_SHA} after waiting
          ${WAIT_SECONDS} seconds. A review was requested at the start of that wait.

          Copilot does not re-review automatically after a push, so a review of an
          earlier commit does not cover this one.

          If Copilot is simply slow or was not reachable, re-run this job -- it
          re-requests and waits again:

            gh run rerun ${GITHUB_RUN_ID}

          Or request the review by hand, from the Reviewers menu or with:

            gh api --method POST \\
              repos/${REPO}/pulls/${PR}/requested_reviewers \\
              -f "reviewers[]=copilot-pull-request-reviewer[bot]"

          This check asserts only that a review happened. It never fails on what the
          review said.
          EOF
          exit 1
